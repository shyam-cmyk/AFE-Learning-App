name: CI — Cross-platform smoke

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke:
    name: Smoke checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @backend/stt-engine
        run: pnpm --filter @backend/stt-engine build

      - name: Lint download script
        run: bash -n packages/backend/stt-engine/download-model.sh

      - name: Run smoke checks (model resolver + dist)
        run: |
          node -e "const p=require('./packages/backend/stt-engine/dist/sherpa.js'); console.log('SUPPORTED:', p.SUPPORTED_SPEECH_LANGUAGES)"

      - name: Run electron-rebuild to validate native modules
        # Use npx so we don't require a global install; this verifies native modules can be rebuilt
        run: npx electron-rebuild --force || echo 'electron-rebuild completed with non-zero exit (tolerated)'

      - name: Basic smoke Node check
        run: echo smoke-ok
